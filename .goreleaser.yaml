version: 2

project_name: grlog

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  # Library project — no binaries
  - skip: true

archives:
  - id: source
    name_template: "{{ .ProjectName }}_{{ .Version }}_src"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      # No go.sum: the module has zero dependencies
      - go.mod
      - "**/*.go"

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

release:
  github:
    owner: gourdian25
    name: grlog
  draft: false
  prerelease: auto
  name_template: "{{ .ProjectName }} {{ .Version }}"
  header: |
    ## {{ .ProjectName }} {{ .Version }}

    Production-ready structured logging library for Go.

    ### Highlights
    - Zero-allocation typed fields and formatting
    - Async logging with configurable overflow policies
    - log/slog interoperability
    - File rotation with compression and age-based cleanup
    - Extensive benchmarks and race tests

    See [CHANGELOG.md](https://github.com/gourdian25/grlog/blob/master/CHANGELOG.md) for full details.

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - '^build:'
      - '^refactor:'
      - '^style:'
      - README
      - Merge pull request
